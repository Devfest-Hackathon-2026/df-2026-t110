[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
oapi-codegen = "2.8.2"
"go:github.com/plheide/go-jsonschema" = "0.28.0"

[tasks.generate]
description = "Generate API models and Echo server from the shared schemas"
dir = "{{config_root}}"
sources = ["../Schema/**/*.yaml", "oapi-codegen.yaml", "oapi-codegen-overlay.yaml"]
outputs = ["infra/router/gen/api/api.gen.go", "infra/router/gen/schema/schema.gen.go"]
run = [
  "go-jsonschema --struct-name-from-title --tags json --package schema --output infra/router/gen/schema/schema.gen.go ../Schema/field/stage.schema.yaml",
  "oapi-codegen -config oapi-codegen.yaml ../Schema/openapi.yaml",
]
