version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gosec
    - nilerr
    - noctx
    - nolintlint
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    rules:
      # httptest.NewRequest constructs an in-memory request and does not perform I/O.
      - path: '_test\.go$'
        linters:
          - noctx
        text: 'net/http/httptest\.NewRequest must not be called'

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
