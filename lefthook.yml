pre-push:
  parallel: true
  jobs:
    - name: server
      root: Server/
      glob:
        - "Server/**"
        - "mise.toml"
      group:
        parallel: true
        jobs:
          - name: gofmt
            run: |
              unformatted_files=$(gofmt -l .) || exit 1
              if [ -n "$unformatted_files" ]; then
                printf 'Run gofmt on these files:\n%s\n' "$unformatted_files"
                exit 1
              fi
          - name: test
            run: go test ./...
          - name: lint
            run: golangci-lint config verify && golangci-lint run ./...
