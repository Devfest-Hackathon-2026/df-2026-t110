openapi: 3.1.0
info:
  title: Programming Learning AR API
  version: 0.1.1
  description: |
    Field、Stage、PicolangProgramはSchema以下のJSON Schemaを参照する。
    Programは保存用のID、名前、picolangのソース、対戦用かどうかを表すフラグを持つ。チュートリアル用の場合はチュートリアルIDも持つ。

servers:
  - url: /api

paths:
  /picolang/v0/builtins:
    get:
      summary: picolang v0 の組み込み関数一覧を取得
      description: 各組み込み関数の名前、シグネチャ、UI 上の表示先を表すタグを返す。
      operationId: listPicolangV0Builtins
      responses:
        "200":
          description: picolang v0 の組み込み関数一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PicolangV0Header"

  /field/{fieldId}:
    $ref: "./openapi/paths/field.yaml#/~1field~1%7BfieldId%7D"
  /program/{programId}:
    $ref: "./openapi/paths/program.yaml#/~1program~1%7BprogramId%7D"
  /program/{programId}/run:
    $ref: "./openapi/paths/program.yaml#/~1program~1%7BprogramId%7D~1run"
  /program/create-with-vibe:
    $ref: "./openapi/paths/program.yaml#/~1program~1create-with-vibe"
  /program:
    $ref: "./openapi/paths/program.yaml#/~1program"
  /match:
    $ref: "./openapi/paths/battle.yaml#/~1match"
  /login:
    $ref: "./openapi/paths/auth.yaml#/~1login"
  /login/callback:
    $ref: "./openapi/paths/auth.yaml#/~1login~1callback"
  /logout:
    $ref: "./openapi/paths/auth.yaml#/~1logout"
  /ranking:
    $ref: "./openapi/paths/ranking.yaml#/~1ranking"
  /me:
    $ref: "./openapi/paths/user.yaml#/~1me"
  /me/username:
    $ref: "./openapi/paths/user.yaml#/~1me~1username"
  /tutorial:
    $ref: "./openapi/paths/tutorial.yaml#/~1tutorial"
  /tutorial/{tutorialId}:
    $ref: "./openapi/paths/tutorial.yaml#/~1tutorial~1%7BtutorialId%7D"
  /tutorial/{tutorialId}/program:
    $ref: "./openapi/paths/tutorial.yaml#/~1tutorial~1%7BtutorialId%7D~1program"
  /battle/program:
    $ref: "./openapi/paths/battle.yaml#/~1battle~1program"

components:
  parameters:
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: string
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
    TutorialId:
      name: tutorialId
      in: path
      required: true
      schema:
        type: string

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Google ログイン後にサーバーが発行するセッション cookie

  headers:
    Location:
      description: リダイレクト先の URL
      schema:
        type: string
        format: uri
    SetCookie:
      description: セッションまたはログイン試行の cookie
      schema:
        type: string

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 認証済みだが操作する権限がない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 対象が存在しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 現在の状態では操作できない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    MatchResult:
      type: object
      description: 対戦の再生履歴と結果の要約
      required: [history, summary]
      properties:
        history:
          $ref: "./game_event/history.schema.yaml"
        summary:
          $ref: "#/components/schemas/MatchSummary"

    MatchSummary:
      type: object
      description: 対戦を申し込んだプレイヤーから見た対戦結果の要約
      required: [score]
      properties:
        score:
          type: object
          description: 両プレイヤーの最終得点。同点の場合は引き分け
          required: [player, opponent]
          properties:
            player:
              type: number
              description: 対戦を申し込んだプレイヤーの最終得点
            opponent:
              type: number
              description: 対戦相手の最終得点

    Field:
      $ref: "./field/field.schema.yaml"

    Stage:
      $ref: "./field/stage.schema.yaml"

    PicolangProgram:
      $ref: "./picolang/toplevel.schema.yaml"

    PicolangV0Header:
      $ref: "./picolang/header_v0/header.schema.yaml"

    Program:
      type: object
      additionalProperties: false
      description: プログラムの保存情報と picolang のソース。作成時にも使用するため、ID は省略可能。
      required: [name, source, isBattle]
      properties:
        id:
          type: string
          description: 保存したプログラムのID
        name:
          type: string
          description: プログラムの表示名
        source:
          description: 文法のバージョンと picolang.v0.program の関数定義の map を持つ picolang のソース
          $ref: "#/components/schemas/PicolangProgram"
        isBattle:
          type: boolean
          description: 対戦用プログラムなら true、チュートリアル用プログラムなら false
        tutorialID:
          type: string
          description: チュートリアルのID。isBattle が false の場合は必須、true の場合は指定不可。
      if:
        properties:
          isBattle:
            const: true
      then:
        not:
          required: [tutorialID]
      else:
        required: [tutorialID]
      examples:
        - id: program-1
          name: 前進する
          isBattle: false
          tutorialID: tutorial-1
          source:
            picolangVersion: 0
            picolang:
              v0:
                program:
                  main:
                    kind: function
                    hintId: 00000000-0000-4000-8000-000000000001
                    params: []
                    returnType: unit
                    body:
                      kind: block
                      hintId: 00000000-0000-4000-8000-000000000002
                      stmts:
                        - kind: call
                          hintId: 00000000-0000-4000-8000-000000000003
                          func: forward
                          args: []
                        - kind: call
                          hintId: 00000000-0000-4000-8000-000000000004
                          func: forward
                          args: []
                        - kind: return
                          hintId: 00000000-0000-4000-8000-000000000005
                          value:
                            kind: literal
                            hintId: 00000000-0000-4000-8000-000000000006
                            type: unit
                            value: null

    SavedProgram:
      description: 保存済みのプログラム
      allOf:
        - $ref: "#/components/schemas/Program"
        - required: [id]

    Match:
      type: object
      required: [id, fieldId, selectedLayoutId, enemyName]
      properties:
        id:
          type: string
        fieldId:
          type: string
        selectedLayoutId:
          type: string
          description: 対戦作成時にサーバーが選んだ配置候補のID。
        status:
          type: string
          enum: [ready, running, finished]
        enemyName:
          type: string

    User:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string

    Tutorial:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        title:
          type: string

    TutorialDetail:
      $ref: "./tutorial/tutorial-detail.schema.yaml"

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
