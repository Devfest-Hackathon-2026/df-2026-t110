/match:
  post:
    tags:
      - battle
    summary: ランク対戦を作成し、シミュレーションを開始
    description: |
      自分の対戦用プログラムのIDをロボット順に3つ指定する。同じIDの重複を許す。
      サーバーは候補配置を1つ選び、自分以外のユーザーからランダムに相手を1人選んで、
      表示名と3台分の対戦用プログラムを登録しているユーザーを候補とする。
      シミュレーションはサーバーアプリ内で同期実行し、結果を保存してから返す。
      結果は両参加者がレスポンスの runId を使って runEvents で繰り返し受け取れる。
      申込時のプログラム指定で、自分の保存済み対戦用プログラム設定は変更しない。
      抽選結果を取得・変更する独立したAPIは設けない。
      レートの更新は未実装。
    operationId: createMatch
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 3
            maxItems: 3
            uniqueItems: false
            items:
              type: object
              additionalProperties: false
              required: [programId]
              properties:
                programId:
                  type: string
                  minLength: 1
    responses:
      "201":
        description: 作成した対戦と抽選結果。結果保存済みのため status は finished
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/Match"
      "400":
        description: 指定数が3つではない、対戦用プログラムではない、または実行できないプログラム
      "401":
        description: 認証されていない
      "403":
        $ref: "../../openapi.yaml#/components/responses/Forbidden"
        description: 表示名が未設定、または他のユーザーのプログラムを指定している
      "404":
        $ref: "../../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../../openapi.yaml#/components/responses/Conflict"
        description: 対戦相手の候補がいない

/battle/program:
  put:
    tags:
      - battle
    summary: 対戦用のプログラムを設定
    description: 自分の対戦用プログラムのIDをロボット順に必ず3つ指定する。同じIDの重複を許す。
    operationId: setBattlePrograms
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 3
            maxItems: 3
            uniqueItems: false
            items:
              type: string
              description: プログラムのID
    responses:
      "204":
        description: 対戦用のプログラム設定を保存した
      "400":
        description: 指定数が3つではない、または対戦用プログラムではない
      "403":
        description: 他のユーザーのプログラム
      "404":
        description: プログラムが存在しない
      "401":
        description: 認証されていない
  get:
    tags:
      - battle
    summary: 対戦用のプログラム設定を取得
    description: 対戦モードで他の人から対戦を申し込まれたときに使うプログラムを取得する。
    operationId: getBattlePrograms
    security:
      - sessionCookie: []
    responses:
      "401":
        description: 認証されていない
      "404":
        description: 対戦用プログラムが未設定
      "200":
        description: 対戦用のプログラム設定
        content:
          application/json:
            schema:
              type: array
              minItems: 3
              maxItems: 3
              uniqueItems: false
              items:
                type: string
                description: プログラムのID
