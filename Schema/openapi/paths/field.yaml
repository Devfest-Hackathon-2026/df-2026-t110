/field/{fieldId}:
  get:
    tags:
      - field
    summary: フィールドを取得
    description: 教材の variant の fieldId から単一ロボットの盤面を返す。複数ロボットとテリトリーを含む対戦用 BattleLayout は Field で表現できないため対象外。
    operationId: getField
    parameters:
      - $ref: "../../openapi.yaml#/components/parameters/FieldId"
    responses:
      "200":
        description: フィールド
        content:
          application/json:
            schema:
              $ref: "../../openapi.yaml#/components/schemas/Field"
      "404":
        $ref: "../../openapi.yaml#/components/responses/NotFound"
