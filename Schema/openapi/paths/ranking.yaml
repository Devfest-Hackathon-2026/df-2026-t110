/ranking:
  get:
    tags:
      - ranking
    summary: ランキングを取得
    description: |
      表示名を設定し、1回以上対戦を申し込んだユーザーをレート降順に返す。
      同じレートのユーザーは同じ順位とし、表示名順に並べる。
    operationId: getRanking
    responses:
      "200":
        description: ランキング
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../../openapi.yaml#/components/schemas/RankingEntry"
