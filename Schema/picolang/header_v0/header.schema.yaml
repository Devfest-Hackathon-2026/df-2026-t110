$schema: https://json-schema.org/draft/2020-12/schema
title: PicolangV0Header
description: 関数名をキー、シグネチャを値とする picolang v0 の組み込み関数定義

type: object
propertyNames:
  $ref: '../v0/name.yaml'
additionalProperties:
  $ref: './signature.schema.yaml'
examples:
  - forward:
      params: []
      returnType: bool
    distance:
      params: [distance_target]
      returnType: integer
    push_back:
      typeParameters: [T]
      params:
        - kind: stack
          elementType: { kind: type_parameter, name: T }
        - kind: type_parameter
          name: T
      returnType:
        kind: stack
        elementType: { kind: type_parameter, name: T }
