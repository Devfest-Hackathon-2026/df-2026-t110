$schema: https://json-schema.org/draft/2020-12/schema
title: UnitLiteral
description: unit 型のリテラル

type: object
additionalProperties: false
required: [kind, hintId, type, value]
properties:
  kind:
    const: literal
  hintId:
    $ref: './hint-id.yaml'
  type:
    const: unit
  value:
    description: unit の () は JSON の null で表す
    type: 'null'
