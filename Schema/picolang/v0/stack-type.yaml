$schema: https://json-schema.org/draft/2020-12/schema
title: StackType
description: 同じ型の要素を持つ連結リストで表現するスタックの型

type: object
additionalProperties: false
required: [kind, elementType]
properties:
  kind:
    type: string
    const: stack
  elementType:
    description: 要素の型。基本型と複合型のどちらも指定できる
    $ref: './type.yaml'
