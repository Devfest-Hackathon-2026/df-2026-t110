$schema: https://json-schema.org/draft/2020-12/schema
title: DirectionLiteral
description: direction 型のリテラル

type: object
additionalProperties: false
required: [kind, hintId, type, value]
properties:
  kind:
    const: literal
  hintId:
    $ref: './hint-id.yaml'
  type:
    const: direction
  value:
    type: string
    enum: [left, right]
