$schema: https://json-schema.org/draft/2020-12/schema
title: FieldEvent
description: フィールドの初期状態または確定した状態の変化を表すイベント

type: object
additionalProperties: false
required: [type, tick, state]
properties:
  type:
    description: フィールドのイベントを表す種別
    type: string
    const: field
  tick:
    description: このイベントが発生したゲーム内の論理時刻。初期状態は 0
    type: integer
    minimum: 0
  state:
    oneOf:
      - $ref: '#/$defs/InitialState'
      - $ref: '#/$defs/UpdateState'

if:
  properties:
    state:
      properties:
        kind:
          const: initial
then:
  properties:
    tick:
      const: 0

$defs:
  InitialState:
    type: object
    additionalProperties: false
    required: [kind, terrain, robots]
    properties:
      kind:
        const: initial
      terrain:
        description: 盤面を行、列の順に並べた二次元配列。terrain[y][x] でマスを参照する
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/$defs/Cell'
      robots:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/RobotState'

  UpdateState:
    description: 1ターンの行動結果と機体の除去を同時に適用する。全機停止時の除去は直前と同じ tick で記録する
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind:
        const: update
      actions:
        type: array
        items:
          oneOf:
            - $ref: '#/$defs/MoveResult'
            - $ref: '#/$defs/RotateResult'
            - $ref: '#/$defs/DrillResult'
            - $ref: '#/$defs/PickUpResult'
            - $ref: '#/$defs/ReleaseResult'
            - $ref: '#/$defs/PrintIntegerResult'
            - $ref: '#/$defs/PrintBoolResult'
      removedRobotIds:
        description: 盤面から除去した機体の ID
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/RobotId'

  Cell:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        $ref: '../field/field.schema.yaml#/$defs/Terrain'
      kind:
        $ref: '#/$defs/LandKind'
      hasLuggage:
        description: 荷物の有無。省略時は false
        type: boolean
      territoryOwner:
        description: テリトリーの所有チーム ID。省略または 0 はテリトリー外
        type: integer
    if:
      properties:
        type:
          const: land
    then:
      required: [kind]
    else:
      maxProperties: 1

  LandKind:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [plain, goal, checkpoint]
      order:
        description: チェックポイントの通過順
        type: integer
    if:
      properties:
        type:
          const: checkpoint
    then:
      required: [order]
    else:
      maxProperties: 1

  RobotId:
    type: string
    minLength: 1

  RobotState:
    type: object
    additionalProperties: false
    required: [id, position, direction, drillDurability]
    properties:
      id:
        $ref: '#/$defs/RobotId'
      position:
        $ref: '../field/field.schema.yaml#/$defs/Position'
      direction:
        $ref: '../field/field.schema.yaml#/$defs/Direction'
      drillDurability:
        description: 掘削の残り回数
        type: integer
        minimum: 0
      teamId:
        description: ロボットの所属チーム ID。省略時はチームなし
        enum: [1, 2]
      carryingLuggage:
        description: 荷物を運搬しているか。省略時は false
        type: boolean

  MoveResult:
    type: object
    additionalProperties: false
    required: [kind, robotId, success]
    properties:
      kind:
        enum: [forward, back]
      robotId:
        $ref: '#/$defs/RobotId'
      success:
        type: boolean
      to:
        description: 成功時に確定した移動先
        $ref: '../field/field.schema.yaml#/$defs/Position'
    if:
      properties:
        success:
          const: true
    then:
      required: [to]
    else:
      not:
        required: [to]

  RotateResult:
    type: object
    additionalProperties: false
    required: [kind, robotId, rotation, direction]
    properties:
      kind:
        const: rotate
      robotId:
        $ref: '#/$defs/RobotId'
      rotation:
        description: 相対的な回転方向
        enum: [left, right]
      direction:
        description: 回転後の向き
        $ref: '../field/field.schema.yaml#/$defs/Direction'

  DrillResult:
    description: 掘削の成否と確定後の残り回数。成功時は対象の岩を荷物・テリトリーのない通常の陸に変える。同じターンに同じ岩を掘削した複数のロボットが成功することがある
    type: object
    additionalProperties: false
    required: [kind, robotId, success, drillDurability]
    properties:
      kind:
        const: drill
      robotId:
        $ref: '#/$defs/RobotId'
      success:
        type: boolean
      target:
        $ref: '../field/field.schema.yaml#/$defs/Position'
      drillDurability:
        type: integer
        minimum: 0
    if:
      properties:
        success:
          const: true
    then:
      required: [target]
    else:
      not:
        required: [target]

  PickUpResult:
    description: 荷物の取得結果。成功時は対象マスから荷物を除き、機体が運搬する
    type: object
    additionalProperties: false
    required: [kind, robotId, success]
    properties:
      kind:
        const: pick_up
      robotId:
        $ref: '#/$defs/RobotId'
      success:
        type: boolean
      target:
        $ref: '../field/field.schema.yaml#/$defs/Position'
    if:
      properties:
        success:
          const: true
    then:
      required: [target]
    else:
      not:
        required: [target]

  ReleaseResult:
    description: 荷物を手放した結果。成功時は target に荷物を置くか、discarded で海への投棄を示す
    type: object
    additionalProperties: false
    required: [kind, robotId, success]
    properties:
      kind:
        const: release
      robotId:
        $ref: '#/$defs/RobotId'
      success:
        type: boolean
      target:
        $ref: '../field/field.schema.yaml#/$defs/Position'
      discarded:
        const: true
    if:
      properties:
        success:
          const: true
    then:
      oneOf:
        - required: [target]
        - required: [discarded]
    else:
      not:
        anyOf:
          - required: [target]
          - required: [discarded]

  PrintBoolResult:
    description: 1ターンを消費して真偽値を吹き出しに表示する
    type: object
    additionalProperties: false
    required: [kind, robotId, bool]
    properties:
      kind:
        const: print_bool
      robotId:
        $ref: '#/$defs/RobotId'
      bool:
        type: boolean

  PrintIntegerResult:
    description: 1ターンを消費して整数を吹き出しに表示する
    type: object
    additionalProperties: false
    required: [kind, robotId, integer]
    properties:
      kind:
        const: print_integer
      robotId:
        $ref: '#/$defs/RobotId'
      integer:
        type: integer
        minimum: -9223372036854775808
        maximum: 9223372036854775807
