$schema: https://json-schema.org/draft/2020-12/schema
title: PicolangVariableInitEvent
description: |
  変数の定義の hintId に、既存の値 ID の紐づけを積む。
  再帰呼び出しでは同じ hintId に複数の紐づけを持ち、最上位を現在の変数とする。
  値全体は保持せず、仮想メモリから解決する。参照カウントは変更しない。

type: object
additionalProperties: false
required: [kind, hintId, valueId]
properties:
  kind:
    type: string
    const: variable_init
  hintId:
    description: 対象の変数の定義の hintId。処理中のノードの hintId とは区別する
    $ref: '../../picolang/v0/hint-id.yaml'
  valueId:
    description: 紐づける値を保持する、同じ interpreter の仮想メモリ内の有効な ID
    $ref: './memory-id.schema.yaml'
