$schema: https://json-schema.org/draft/2020-12/schema
title: PicolangVariableUpdateEvent
description: |
  定義の hintId に対応する最上位の変数の紐づけを、既存の値 ID に更新する。
  値全体や差分は保持せず、代入先の値は仮想メモリから解決する。
  参照カウントは変更しない。古い値の参照解放は後続の memory_release で報告する。

type: object
additionalProperties: false
required: [kind, hintId, valueId]
properties:
  kind:
    type: string
    const: variable_update
  hintId:
    description: 対象の変数の定義の hintId。処理中のノードの hintId とは区別する
    $ref: '../../picolang/v0/hint-id.yaml'
  valueId:
    description: 紐づける値を保持する、同じ interpreter の仮想メモリ内の有効な ID
    $ref: './memory-id.schema.yaml'
