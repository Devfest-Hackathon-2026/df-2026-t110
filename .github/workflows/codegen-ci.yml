name: CI (codegen)

on:
  push:
    paths:
      - 'Schema/**'
      - 'Server/infra/router/gen/**'
      - 'Server/oapi-codegen*.yaml'
      - 'Server/sqlc.yaml'
      - 'Server/infra/repo/sql/**'
      - 'Server/infra/repo/gen/**'
      - 'mise.toml'
      - '.github/workflows/codegen-ci.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'Schema/**'
      - 'Server/infra/router/gen/**'
      - 'Server/oapi-codegen*.yaml'
      - 'Server/sqlc.yaml'
      - 'Server/infra/repo/sql/**'
      - 'Server/infra/repo/gen/**'
      - 'mise.toml'
      - '.github/workflows/codegen-ci.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
      - name: Check generated code
        run: |
          mise run --force generate
          git diff --exit-code
