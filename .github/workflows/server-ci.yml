name: CI (server)

on:
  push:
    branches:
      - main
    paths:
      - 'lang/**'
      - 'Server/**'
      - 'Textbooks/pages/**'
      - 'infra/**'
      - '.github/workflows/server-deploy.yml'
      - 'mise.toml'
      - '!Server/AGENTS.md'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'lang/**'
      - 'Server/**'
      - 'Textbooks/pages/**'
      - 'infra/**'
      - '.github/workflows/server-deploy.yml'
      - 'mise.toml'
      - '!Server/AGENTS.md'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: go golangci-lint
      - uses: actions/cache@v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'Server/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'Server/go.sum') }}-
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Validate textbook pages
        run: go run ./cmd/validate_textbooks ../Textbooks/pages
      - name: Build embedded textbooks
        run: |
          mkdir -p cmd/textbooks
          cp -a ../Textbooks/pages/. cmd/textbooks/
          go build -tags textbook_embed -o /tmp/server-embed ./cmd
      - name: golangci-lint
        run: |
          golangci-lint config verify
          golangci-lint run ./...
