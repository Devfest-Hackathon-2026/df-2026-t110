name: CI (OpenAPI)

on:
  push:
    paths:
      - 'Schema/**'
      - 'mise.toml'
      - '.github/workflows/openapi-ci.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'Schema/**'
      - 'mise.toml'
      - '.github/workflows/openapi-ci.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: node npm:@redocly/cli
      - name: Validate OpenAPI specification
        run: redocly lint --extends=spec Schema/openapi.yaml
      - name: Validate JSON Schemas
        run: |
          find Schema/field Schema/picolang -type f -name '*.yaml' -print0 |
            xargs -0 pipx run --spec check-jsonschema==0.39.0 check-jsonschema --check-metaschema
