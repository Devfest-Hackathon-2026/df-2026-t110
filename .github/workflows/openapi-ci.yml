name: CI (OpenAPI)

on:
  push:
    paths:
      - 'Schema/**'
      - 'mise.toml'
      - '.github/workflows/openapi-ci.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'Schema/**'
      - 'mise.toml'
      - '.github/workflows/openapi-ci.yml'
      - '.github/workflows/actions.lock'

permissions:
  contents: read

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.6
        with:
          install_args: node npm:@redocly/cli
      - name: Validate OpenAPI specification
        run: redocly lint --extends=spec Schema/openapi.yaml
      - name: Validate game history examples
        run: |
          pipx run --spec check-jsonschema==0.39.0 check-jsonschema \
            --base-uri "file://${GITHUB_WORKSPACE}/Schema/game_event/history.schema.yaml" \
            --schemafile Schema/game_event/history.schema.yaml Schema/game_event/examples/*.json
