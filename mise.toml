[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
oapi-codegen = "2.8.2"
"go:github.com/plheide/go-jsonschema" = "0.28.0"
node = "24.22.2"
"npm:@redocly/cli" = "2.76.0"
sqlc = "1.31.1"
terraform = "1.17.1"

[tasks.test-server]
description = "Run server tests with a disposable PostgreSQL container (requires Docker)"
dir = "{{config_root}}/Server"
run = "go test -count=1 ./..."

[tasks.generate]
description = "Generate frontend API types, server API models, Echo server and database queries"
dir = "{{config_root}}/Server"
sources = [
  "../Schema/**/*.yaml",
  "../Client/scripts/generate-api.mjs",
  "../Client/package.json",
  "../package.json",
  "../pnpm-lock.yaml",
  "../pnpm-workspace.yaml",
  "oapi-codegen.yaml",
  "oapi-codegen-overlay.yaml",
  "sqlc.yaml",
  "infra/repo/sql/**/*.sql",
  "game/robot/picolang_bot/parse/**/*.go",
]
outputs = [
  "../Client/src/api/schema.d.ts",
  "infra/router/gen/api/api.gen.go",
  "infra/router/gen/schema/schema.gen.go",
  "infra/router/gen/history/history.gen.go",
  "infra/repo/gen/db/*.go",
  "game/robot/picolang_bot/parse/schema.gen.json",
]
run = [
  "corepack pnpm -C ../Client generate:api",
  "go-jsonschema --struct-name-from-title --tags json --package schema --output infra/router/gen/schema/schema.gen.go ../Schema/tutorial/tutorial-detail.schema.yaml ../Schema/picolang/toplevel.schema.yaml ../Schema/picolang/header_v0/header.schema.yaml",
  "go-jsonschema --struct-name-from-title --tags json --use-number --package history --output infra/router/gen/history/history.gen.go ../Schema/game_event/history.schema.yaml ../Schema/game_event/field-event.schema.yaml ../Schema/game_event/picolang-event.schema.yaml",
  "oapi-codegen -config oapi-codegen.yaml ../Schema/openapi.yaml",
  "sqlc generate",
  "go generate ./game/robot/picolang_bot/parse",
]

[tasks.redocly-preview]
description = "Preview the OpenAPI schema with Redoc at http://127.0.0.1:8080"
dir = "{{config_root}}"
run = "redocly preview --project-dir Schema --port 8080"
