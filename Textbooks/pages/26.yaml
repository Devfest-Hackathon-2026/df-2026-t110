# 学び方: 発展
id: stack-order
title: 上のカードから順に使う
goal: 入れる順と、使う順のちがいを考えよう。
description: 3マス進み、左を向いて2マス進もう。カードを入れる順番を直そう。
lesson: 最後に入れた数を使い、そのカードを取ると、次の数が上に出ます。入れた順とは反対に使います。
guide:
  - 進む順は3、2です。先に使う3を、山の一番上にするには、どの順に入れるかな。
  - 2、3の順に入れよう。使ったカードをのぞくには、「〜の一番うしろを取り除いたスタック」を使います。
  - のぞいたあとの山も、同じ「カード」に入れ直します。読むだけでは、同じ数を何度も使ってしまいます。
  - 「〜の長さ」が0なら空です。空の山からは読んだり取ったりできないので、くり返しを終えます。
