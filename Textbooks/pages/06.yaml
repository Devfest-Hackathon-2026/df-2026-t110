# 学び方: 操作
# 制作用メモ: 観測値の表示は画面側で終了メッセージに上書きされる。二つの答えを残して見比べる表示が必要。
id: look-ahead
title: 前のマスを見分ける
goal: 前のマスを調べ、岩と陸を見分けよう。
description: 前のマスを見て、二つの答えを予想しよう。見本で調べて確かめよう。
lesson: 調べるのは、向いている方のとなり1マスです。ゴールのマスも陸に入ります。
guide:
  - 岩かな、陸かな。道ごとに二つの答えを考えよう。
  - 海なら、岩かどうかも陸かどうかも「いいえ」です。道の外も海です。
  - trueは「はい」、falseは「いいえ」です。見本は調べたあと、上の道を進みます。
