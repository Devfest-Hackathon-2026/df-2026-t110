# 学び方: 操作
# 制作用メモ: 一本道の固定盤面で観測前後の違いを学ぶ。見本は岩の手前で止まる。観測結果を残す表示が必要で、到着だけでは理解を判定しない。
id: look-ahead
title: 前のマスを見分ける
goal: 前の1マスを調べ、変わった答えを比べよう。
description: 岩をこわす前とあとで、二つの答えを比べよう。最後はゴールへ進もう。
lesson: 調べるのは、向いている方のとなり1マスです。進んだり岩をこわしたりすると、答えが変わります。
guide:
  - trueは「はい」、falseは「いいえ」です。
  - 見本は、陸を調べて1マス進み、次に岩を調べます。答えを比べよう。
  - 岩をこわし、同じ二つの命令でもう一度調べよう。こわしたマスは陸です。
  - 答えを見たあと、2マス進もう。ゴールのマスも陸です。
