# 学び方: 考え方
id: if-rock
title: もし岩があったら
goal: 「もし」を使って、必要なときだけ動かそう。
description: 「前に進む」の置き場所を直し、どちらの道でもゴールへ進もう。
lesson: 「もし」の中は、条件が「はい」のときだけ動きます。その下の命令は、どちらでも動きます。
guide:
  - 実行すると、下の「フィールド候補」のうちどれかが選ばれます。「前の配置」「次の配置」をおして、ステージがどう変わるか見てみましょう。
  - 岩があるときには岩をこわして進みたいです。「もし～なら」の中に「岩をこわす」をいれましょう。
  - ゴールに行くためには、「前に進む」は何回必要ですか？
  - 実行で選ばれた道を見て、「もし」の中が動くか確かめよう。
