# 学び方: 考え方
id: if-rock
title: もし岩があったら
goal: 「もし」を使って、必要なときだけ動かそう。
description: 前進する命令の置き場所を直し、どちらの道でもゴールへ進もう。
lesson: 「もし」の中は、条件が「はい」のときだけ動きます。その下の命令は、どちらでも動きます。
guide:
  - 実行すると、道のどちらかが選ばれます。見本は、それぞれ何マス進むかな。
  - 岩をこわすのは、岩があるときだけです。前進は、どちらの道でも必要です。
  - 岩をこわす命令だけを「もし」の中に残そう。前進は二つとも外に置こう。
  - 実行で選ばれた道を見て、「もし」の中が動くか確かめよう。
