# 学び方: 考え方
id: function-result
title: 関数の答えを使う
goal: 関数が返す数を、あとの命令に使おう。
description: 「進む数」が返す数を変え、ゴールまで進もう。
lesson: 関数は、答えを返すこともできます。よび出すと、その場所で答えを使えます。
guide:
  - 「進む数」は、数を返す関数です。ロボットを動かす命令は入っていません。
  - 「main」は、返ってきた数を「歩数」に入れています。
  - 「進む数」の「〜を返す」で、数を3に変えよう。くり返しの回数も3になります。
