# 学び方: 考え方
id: call-function
title: 動きに名前をつける
goal: 動きをまとめた関数を、名前でよび出そう。
description: 「二歩進む」をよび出す命令を足し、ゴールへ進もう。
lesson: いくつかの命令をまとめ、名前をつけたものを「関数」といいます。関数は、他の場所から実行することができます。動きを一つのまとまりにしたいとき便利です。
guide:
  - 上の方にある「二歩進む」を開こう。「前に進む」が二つ入っています。
  - 「main」は最初に動く場所です。「main」にもどって「二歩進む」を一つ置こう。「関数」から他の関数のブロックを使うことができます。「二歩進む」ブロックを置いたら実行してみましょう。
  - ゴールまで6マスです。「main」から「二歩進む」を何回よび出せばいいかな。
