# 学び方: 操作
# 制作用メモ: distance_target は正式な picolang スキーマに従う。教材画面では対象の選択・実行と、観測値を残す表示への対応が必要。
id: measure-distance
title: きょりを調べる
goal: 岩やゴールまでのきょりを調べよう。
description: 岩とゴールまでのマス数を予想し、見本で調べよう。
lesson: 向いている方の一直線上にある、一番近い岩やゴールまでを数えます。
guide:
  - 調べるものを、岩かゴールから選びます。となりのマスまでのきょりは1です。
  - 1マス進むと、調べた数はどう変わるかな。
  - 岩まで3マスなら、2マス進むと岩の手前です。岩のマスまで進む数とはちがいます。
