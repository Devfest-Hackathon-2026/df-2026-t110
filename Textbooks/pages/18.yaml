# 学び方: 考え方
id: function-argument
title: 関数に数をわたす
goal: 同じ関数にわたす数を変え、動きを変えよう。
description: 「歩く」にわたす数を、二つの道に合わせよう。
lesson: 関数にわたす数などを「引数」といいます。「歩く」は、受け取った数だけ前進します。
guide:
  - 「歩く」の中では、受け取った「歩数」をくり返す回数に使います。
  - 初めの道は3マス、左に回った先は2マスです。
  - 「main」の初めの「歩く」に3、次の「歩く」に2をわたそう。
  - 関数の中を書き直さず、わたす数だけ変えられます。
