# 学び方: 練習
id: after-repeat
title: くり返したあとに進む
goal: くり返す動きと、最後の動きを分けよう。
description: 同じ動きをまとめ、最後の1マスでゴールへ進もう。
lesson: くり返しが終わると、その下の命令に進みます。
guide:
  - 曲がり角までのマス数を、それぞれ数えよう。
  - 2マス進んで左に回る動きは、何回あるかな。
  - その動きを2回くり返そう。最後の前進は、くり返しの外に置きます。
stage:
  variants:
    - id: after-repeat-1
      width: 3
      height: 3
      terrain:
        - [sea, land, land]
        - [sea, sea, land]
        - [land, land, land]
      objects:
        - type: goal
          position: { x: 1, y: 0 }
      robot:
        position: { x: 0, y: 2 }
        direction: east
      drillLimit: 0
  clearCondition:
    type: reach_goal
