# 学び方: 考え方
# 制作用メモ: 前進回数0〜7の8候補。実行時に1候補が選ばれるため、児童に候補の指定や全候補の実行を求めない。
id: while-land
title: 道が続く間は進む
goal: 条件が合う間、同じ動きをくり返そう。
description: 道の長さが変わっても、海の手前で左に回ってゴールへ進もう。
lesson: 「～の間くり返す」ブロックは、条件を毎回調べます。「はい」ならくり返し、「いいえ」ならその下に進みます。
guide:
  - このステージはいろんなフィールドがあります。まずは「フィールド候補」を見てみましょう。どうしたらゴールまで行けるかな。
  - 海にぶつかるまでまっすぐ進んで、左に曲がるとゴールに行けそうです。
  - 「「前のマスを調べて返す」は陸」を「～の間」の条件にしよう。道の外は海です。
  - 条件が合う間のくり返しの中に、「前に進む」を入れよう。進むたびに次のマスを調べます。
  - くり返しの外で左に回り、1マス進もう。初めから前が海なら、前進は0回です。
  - 実行で選ばれた道でも、海の手前で止まるか確かめよう。
