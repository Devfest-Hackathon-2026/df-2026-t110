# 学び方: 操作
# 制作用メモ: distance_target は正式な picolang スキーマに従う。教材画面では対象の選択・実行と、観測値を残す表示への対応が必要。見本は2回目の観測後に止まる。
id: measure-distance
title: きょりを調べる
goal: 岩やゴールまでのきょりを調べよう。
description: 「きょりを返す」の答えを見よう。岩の手前まで進み、岩をこわしてゴールへ進もう。
lesson: 向いている方の一直線上にある、一番近い岩やゴールまでを数えます。
guide:
  - 「きょりを返す」では、調べるものを選ぶと、きょりがわかります。
  - 返ってきた数を「〜と言う」に入れると、答えを読めます。
  - 見本は1マス進んでもう一度調べます。二つの答えは、いくつへったかな。
  - 岩までの数から1を引くと、岩の手前までに進む回数になります。岩をこわして先へ進もう。
