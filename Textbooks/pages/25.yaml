# 学び方: 発展
id: stack-cards
title: "[難しい] 数のカードを重󠇥ねる"
goal: 数を順に入れ、最後に入れた数を使おう。
description: カードの山の最後の数を直して、3マス先のゴールへ進もう。
lesson: 数のカードを重󠇥ねた山を考えよう。最後に重󠇥ねたカードから使うしくみを「スタック（stack）」といいます。
guide:
  - 「空のスタック」から始め、「〜の一番うしろに〜を追加したスタック」で1、0の順に足しています。
  - 「〜の一番うしろ」が、山の一番上を読むブロックです。見本では、最後に入れた0が分かります。
  - 最後に入れる数を3に変えよう。上の数だけ進むと、ゴールに着きます。
  - 読むだけでは、カードはへりません。
