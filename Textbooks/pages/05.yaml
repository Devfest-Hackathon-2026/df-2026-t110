# 学び方: 操作・練習
id: choose-rock
title: どの岩をこわす？
goal: 岩をこわせる回数に合わせて、道を選ぼう。
description: こわせる岩は1こまでです。通れる道を選んで、ゴールへ進もう。
lesson: 岩を一つこわすと、使える回数が1回へります。道全体を見て考えよう。
guide:
  - まっすぐの道と、下の道にある岩を数えよう。
  - まっすぐの道には岩が3こ、下の道には1こあります。
  - 下の道を通り、岩の手前でこわそう。最後はゴールを向いて進もう。
stage:
  variants:
    - width: 5
      height: 2
      terrain:
        - [land, rock, rock, rock, land]
        - [land, land, rock, land, land]
      objects:
        - type: goal
          position: { x: 4, y: 0 }
      robot:
        position: { x: 0, y: 0 }
        direction: east
      drillLimit: 1
  clearCondition:
    type: reach_goal
