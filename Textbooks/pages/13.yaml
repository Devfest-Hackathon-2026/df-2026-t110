# 学び方: 操作
id: pick-and-place
title: 荷物をひろう・置く
goal: 荷物をひろって、前の陸に置こう。
description: 見本に「拾う」と「置く」を足して、荷物をじん地に置こう。
lesson: 「拾う」と「置く」は、前のとなり1マスに使います。荷物は一つ持てます。
guide:
  - 見本の最初に「拾う」を入れよう。荷物を持ったまま動けます。
  - 黄󠇢緑󠇡色󠇡のマスは「じん地」です。じん地の手前に来たら、「置く」を実行しよう。海には落とさず、陸に置きます。
  - じん地に荷物を置けたらクリアです。ロボットはじん地の手前にいてもかまいません。
