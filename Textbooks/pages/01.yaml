# 学び方: 操作
id: first-step
title: はじめの一歩
goal: 命令を一つ置いて、ロボットを動かそう。
description: 「前に進む」を一つ置いて、「実行」ボタンをおそう。
lesson: 「前に進む」で、向いている方に1マス進みます。
guide:
  - 矢印を見よう。ロボットはどちらを向いているかな。
  - ゴールは、前のとなりのマスにあります。
  - 動く先を予想してから、実行して確かめよう。
stage:
  variants:
    - id: first-step-1
      width: 2
      height: 1
      terrain:
        - [land, land]
      objects:
        - type: goal
          position: { x: 1, y: 0 }
      robot:
        position: { x: 0, y: 0 }
        direction: east
      drillLimit: 0
  clearCondition:
    type: reach_goal
