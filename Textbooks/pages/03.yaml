# 学び方: 考え方
id: command-order
title: 命令を順番に並べる
goal: 動く順番を考えて、命令を並べよう。
description: 見本の命令を並べかえて、曲がった先のゴールへ進もう。
lesson: 命令は上から順に動きます。同じ命令でも、順番が変わると動く道が変わります。
guide:
  - 見本では、どのマスで曲がるかな。指でたどろう。
  - ゴールを向くには、曲がる前に何マス進めばよいかな。
  - 「前に進む」を二つ、左を選んだ「〜向きに回転する」、「前に進む」の順に並べよう。
