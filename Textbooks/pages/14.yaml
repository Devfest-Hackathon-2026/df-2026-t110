# 学び方: 練習
# 制作用メモ: 配達先はゴールのマスで示す。reach_goal は荷物の位置を判定しないため、配達は盤面を見て確かめる。
id: deliver-luggage
title: 荷物を届ける
goal: 運ぶ順番と、立つ場所を考えよう。
description: 道の横の荷物をひろい、ゴールのマスに届けよう。
lesson: ひろう場所へ行く、運ぶ、置く、ゴールへ進む順に考えよう。
guide:
  - 荷物のとなりに立ち、荷物の方を向こう。
  - ゴールのとなりから、ゴールの方を向いて置こう。
  - 最後に進み、荷物とロボットがゴールのマスにいるか確かめよう。
stage:
  variants:
    - id: deliver-luggage-1
      width: 5
      height: 3
      terrain:
        - [sea, sea, sea, land, sea]
        - [sea, land, sea, land, sea]
        - [land, land, land, land, land]
      objects:
        - type: goal
          position: { x: 3, y: 0 }
        - type: luggage
          id: parcel
          position: { x: 1, y: 1 }
      robot:
        position: { x: 0, y: 2 }
        direction: east
      drillLimit: 0
  clearCondition:
    type: reach_goal
