# 学び方: 練習
id: deliver-luggage
title: 荷物を届ける
goal: 運ぶ順番と、立つ場所を考えよう。
description: 道の横の荷物をひろい、じん地に届けよう。
lesson: ひろう場所へ行く、運ぶ、じん地に置く。この順番で考えよう。
guide:
  - 荷物のとなりに立ち、荷物の方を向こう。
  - じん地のとなりから、じん地の方を向いて置こう。
  - じん地に荷物を置けたらクリアです。ロボットはじん地の手前にいてもかまいません。
stage:
  variants:
    - id: deliver-luggage-1
      width: 5
      height: 3
      terrain:
        - [sea, sea, sea, land, sea]
        - [sea, land, sea, land, sea]
        - [land, land, land, land, land]
      objects:
        - type: territory
          position: { x: 3, y: 0 }
        - type: luggage
          id: parcel
          position: { x: 1, y: 1 }
      robot:
        position: { x: 0, y: 2 }
        direction: east
      drillLimit: 0
  clearCondition:
    type: deliver_luggage
    requiredCount: 1
