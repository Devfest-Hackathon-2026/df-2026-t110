# 学び方: 練習
# 制作用メモ: 教材画面で distance の対象に岩を選び、実行できるようにする必要がある。
id: use-distance
title: 調べた数を使って進む
goal: 調べた数を覚え、あとの動きに使おう。
description: 岩までのきょりを覚え、どの道が選ばれてもゴールへ進もう。
lesson: 岩までのきょりを覚え、どのフィールドが選ばれてもゴールへ進もう。スタートから岩までと、岩からゴールまでは、同じマス数です。
guide:
  - 見本は、岩までのきょりを「歩数」に入れて、その数を言います。
  - 引き算のブロックで「歩数」から1を引き、その数だけ進むと、岩の手前に着きます。引き算のブロックは「計算」にあります。
  - 「岩をこわす」を使って1マス進み、覚えた数だけ進もう。
