# 学び方: 発展
id: optional-fallback
title: "[難しい] 数がないときの動きを決める"
goal: 数があるか調べてから、安全に取り出そう。
description: 数がないときにも、3マス先のゴールへ進めるように見本を直そう。
lesson: 「〜に値がある」で調べ、「はい」のときだけ「〜の値を取り出す」を使います。「いいえ」なら、別の動きを決めます。
guide:
  - 見本は「値の入っていないのヌラブル」を使っています。「そうではないなら」の中が動きます。
  - 「そうではないなら」のくり返す回数を、1から3に変えよう。
  - 次は「3を入れたヌラブル」に変えよう。「もし」の中が動いても、同じゴールに着きます。
  - 数がないのに取り出すと、実行が止まります。先に「〜に値がある」で調べよう。
