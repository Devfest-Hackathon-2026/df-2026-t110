# 学び方: 考え方
id: replace-number
title: 覚えた数を入れかえる
goal: 同じ名前の数を、あとから入れかえよう。
description: 二つ目の道へ進む前に、「歩数を〜に変える」を足そう。
lesson: 数を入れかえると、そのあとに使うのは新しい数です。
guide:
  - 初めの道は2マスです。見本は、二つ目の道も2マス進みます。
  - 二つ目の道は何マスかな。最初の数を変えず、あとから入れかえよう。
  - 左を選んだ「〜向きに回転する」の下に、「歩数を〜に変える」を入れ、数を3にしよう。
