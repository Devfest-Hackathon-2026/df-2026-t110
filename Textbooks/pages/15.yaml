# 学び方: 考え方
id: remember-number
title: 数に名前をつけて覚える
goal: 覚えた数を、くり返す回数に使おう。
description: 見本の「歩数」の数を変えて、ゴールまで進もう。
lesson: 名前をつけて数を覚えるしくみを「変数」といいます。
guide:
  - 見本の「歩数」には、最初に1が入っています。
  - くり返しの「-1まで」の前には、「変数」の「歩数」が入っています。ゴールへ行くために必要なマス数を数えよう。
  - 「歩数」に3を入れると、3回前進します。数を変えて動きを比べよう。
