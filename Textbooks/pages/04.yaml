# 学び方: 操作
id: break-rock
title: 岩をこわす
goal: 前の岩をこわして、道を開こう。
description: 見本に岩をこわす命令を足して、ゴールへ進もう。
lesson: 岩のマスには進めません。前のとなりの岩をこわすと、通れる陸になります。
guide:
  - まずは見本を試そう。岩の前で進めなくなります。
  - 岩をこわしても、ロボットのいるマスは変わりません。
  - 岩をこわす命令を先頭に足そう。そのあとの前進で進めます。
