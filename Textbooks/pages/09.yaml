# 学び方: 考え方
id: repeat-count
title: 回数を決めてくり返す
goal: 同じ命令を、回数を決めてくり返そう。
description: くり返す回数を決め、中に「前に進む」を入れよう。
lesson: 同じ命令が続くときは、することと回数をまとめて書けます。
guide:
  - くり返しを使うと、同じ命令を好きな回数だけくり返すことができます。
  - 今いるマスの次から、ゴールまでを数えよう。
  - 「から」の前を0、「-1まで」の前をゴールまでのきょりにしよう。0、1、2、3、4の5回動󠇢きます。
  - 試しに実行してみよう。ロボットはどんな動きをするかな。
  - ゴールに行くため、「〜から〜-1まで」のくり返しの中に、「前に進む」を一つ入れよう。
