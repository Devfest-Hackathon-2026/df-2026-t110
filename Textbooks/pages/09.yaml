# 学び方: 考え方
id: repeat-count
title: 回数を決めてくり返す
goal: 同じ命令を、回数を決めてくり返そう。
description: くり返す回数を決め、中に前進する命令を入れよう。
lesson: 同じ命令が続くときは、することと回数をまとめて書けます。
guide:
  - 今いるマスの次から、ゴールまでを数えよう。
  - 回数を決めるくり返しの中に、「前進する」を一つ入れよう。
  - 「はじめ」は0、「ここまで」は5にしよう。0、1、2、3、4の5回動きます。
