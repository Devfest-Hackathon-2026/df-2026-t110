# 学び方: 発展
# 制作用メモ: nullable の概念を、本実装の option<integer> / some / none で扱う。unit や整数0を欠損値として扱わない。
id: optional-number
title: "[難しい] 数がある・ないを覚える"
goal: 数があることと、ないことを分けて覚えよう。
description: 見本の「歩数」に入れる数を変えて、3マス先のゴールへ進もう。
lesson: 数がないことも覚えられるしくみを、nullable（ヌラブル）といいます。
guide:
  - 0のカードがある箱と、空の箱はちがいます。「〜を入れたヌラブル」は数あり、「値なしのヌラブルを作る」は数なしです。
  - 見本は「0を入れたヌラブル」です。「〜に値がある」の答えは「はい」ですが、進む回数は0です。
  - 入れる数を3に変えよう。「〜の値を取り出す」で中の数を使うと、3回進みます。
  - 値は、ここでは数のことです。数がないときは、取り出せません。
