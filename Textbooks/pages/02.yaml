# 学び方: 操作
id: turn
title: 向きを変える
goal: 右と左を選んで、向きを変えよう。
description: 見本の「〜向きに回転する」で左を選び、ゴールへ進もう。
lesson: 回転しても、いるマスは変わりません。右と左は、ロボットから見た向きです。
guide:
  - 今は右向きです。ゴールを向くには、右と左のどちらに回るかな。
  - 回ったあとの矢印を予想しよう。
  - 「〜向きに回転する」で左を選ぼう。その下の「前に進む」でゴールに着きます。
